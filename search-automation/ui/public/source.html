<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Automation – Page Source</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
<style>
  main { display: grid; grid-template-columns: 280px 1fr; gap: 16px; height: calc(100vh - 50px); padding: 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; height: auto; } }
  #list { display: flex; flex-direction: column; min-height: 0; padding: 0; overflow: hidden; }
  #lsearch { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  #lsearch input { width: 100%; box-sizing: border-box; padding: 7px 9px; }
  #lsearch .muted { font-size: 12px; margin-top: 5px; }
  #caps { flex: 1; overflow: auto; min-height: 0; }
  .cap { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .cap:hover { background: var(--code-bg); }
  .cap.sel { background: var(--code-bg); box-shadow: inset 3px 0 0 var(--accent); }
  .cap.captcha { background: color-mix(in srgb, var(--warn) 13%, transparent); }
  .cap.captcha:hover, .cap.captcha.sel { background: color-mix(in srgb, var(--warn) 22%, transparent); }
  .cap .cpill { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 8px; font-size: 10px; font-weight: 700; letter-spacing: .03em; color: var(--warn); border: 1px solid var(--warn); vertical-align: 1px; }
  /* CAPTCHA bar with Run again (only on CAPTCHA captures) */
  #again { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; padding: 10px 16px;
    background: color-mix(in srgb, var(--warn) 10%, var(--panel)); border-bottom: 1px solid color-mix(in srgb, var(--warn) 35%, var(--border)); }
  #again .atext { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  #again .atext b { font-size: 13px; color: var(--warn); }
  #again .atext span { font-size: 12px; color: var(--muted); }
  #again .opts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #again select { height: 32px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; font-size: 12px; }
  #again .msg { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
  #again .msg:empty { display: none; }
  @media (max-width: 860px) { #again { grid-template-columns: 1fr; } }
  .cap .q { font-weight: 600; }
  .cap .m { font-size: 12px; color: var(--muted); }
  .cap .vs { font-size: 12px; font-weight: 600; text-decoration: none; }
  .cap .vs:hover { text-decoration: underline; }
  #view { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 0; overflow: hidden; }
  #head { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  #head h2 { margin: 0 0 4px; font-size: 16px; }
  #head .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 6px; }
  .bb { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; border: 1px solid var(--border); color: var(--muted); }
  .mb { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .mb.logged-in { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .mb.incognito { background: color-mix(in srgb, var(--tag) 20%, transparent); color: var(--tag); }
  #head .m { font-size: 12px; color: var(--muted); word-break: break-all; }
  #toolbar { padding: 8px 16px; border-bottom: 1px solid var(--border); gap: 8px; }
  #body { flex: 1; overflow: auto; min-height: 300px; background: var(--code-bg); }
  .t { color: var(--tag); } .a { color: var(--attr); } .v { color: var(--str); } .c { color: var(--cmt); font-style: italic; }
  iframe { flex: 1; border: 0; width: 100%; background: #fff; }
  #results { padding: 12px 16px; overflow: auto; }
  /* Ads data */
  #ads { padding: 14px 16px; display: grid; gap: 12px; background: var(--bg); min-height: 100%; align-content: start; }
  #ads .kw { font-size: 13px; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .tile .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .s { font-size: 11px; color: var(--muted); margin-top: 2px; }
  #ads table td, #ads table th { font-size: 13px; padding: 6px 8px; }
  #ads td.num, #ads th.num { text-align: right; font-variant-numeric: tabular-nums; }
  #ads .note { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  #ads tr.cur td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .fsec { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .fhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .fhead h3 { margin: 0; font-size: 15px; }
  .fhead p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .fval { text-align: right; white-space: nowrap; }
  .fval b { display: block; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .fval span { font-size: 12px; color: var(--muted); }
  .fbody { padding: 8px 14px 12px; max-height: 420px; overflow: auto; }
  .pill { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 11px; border: 1px solid var(--border); color: var(--muted); }
  .pill.im { color: var(--accent); border-color: var(--accent); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  /* Parsed page */
  #parsed { padding: 14px 16px; display: grid; gap: 12px; background: var(--bg); min-height: 100%; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  .card summary { padding: 10px 14px; font-weight: 600; cursor: pointer; }
  .card .cb { padding: 0 14px 12px; }
  .card ul { margin: 0; padding-left: 20px; } .card li { margin: 3px 0; }
  .kv th { width: 170px; text-transform: none; letter-spacing: 0; font-size: 13px; }
  .kv td, .kv th { padding: 5px 8px; font-size: 13px; word-break: break-word; }
  .kv td.u { font-size: 12px; word-break: break-all; }
  .res { display: grid; grid-template-columns: 52px 1fr; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .res:last-child { border-bottom: 0; }
  .rn { color: var(--muted); font-size: 12px; padding-top: 2px; }
  .rs { color: var(--muted); font-size: 12px; word-break: break-all; }
  .rt { font-size: 15px; font-weight: 500; margin: 1px 0 3px; }
  .rt a { text-decoration: none; } .rt a:hover { text-decoration: underline; }
  .rp { font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { border: 1px solid var(--border); border-radius: 14px; padding: 3px 10px; font-size: 13px; }
</style>
</head>
<body>
<header class="top">
  <h1>Search Automation · Google search runner</h1>
  <nav><a href="/">1. Run queries</a><a href="/source" class="active">2. Page source</a></nav>
  <button class="theme-btn" id="themeBtn" type="button">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tl">Dark</span>
  </button>
</header>
<main>
  <aside class="panel" id="list">
    <div id="lsearch">
      <input id="lq" type="search" placeholder="Search by MCAT id or keyword…" autocomplete="off">
      <div id="lcount" class="muted"></div>
    </div>
    <div id="caps"><div class="empty">Loading…</div></div>
  </aside>
  <section class="panel" id="view"><div class="empty">Select a capture on the left.</div></section>
</main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const kb = (n) => n > 1048576 ? (n / 1048576).toFixed(2) + " MB" : (n / 1024).toFixed(1) + " KB";

let captures = [], current = null, raw = "", mode = "ads", doc = null;
const adsCache = new Map(); // capture id -> ads report from SQLite

// Every word typed must appear in the MCAT id (tag) or the search keyword
function matches(c, q) {
  const hay = `${c.tag || ""} ${c.query}`.toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
}

async function loadList() {
  captures = await (await fetch("/api/captures")).json();
  adsCache.clear(); // new runs change the keyword totals
  renderList();
  const want = new URLSearchParams(location.search).get("id");
  if (captures.length) select(captures.some((c) => c.id === want) ? want : (current?.id && captures.some((c) => c.id === current.id) ? current.id : captures[0].id));
}

function renderList() {
  const list = $("#caps");
  const q = $("#lq").value.trim();
  const shown = q ? captures.filter((c) => matches(c, q)) : captures;
  $("#lcount").textContent = q ? `${shown.length} of ${captures.length} captures` : `${captures.length} captures`;
  if (!captures.length) { list.innerHTML = `<div class="empty">No captures yet.<br><a href="/">Run a query</a> first.</div>`; return; }
  if (!shown.length) { list.innerHTML = `<div class="empty">No captures match “${esc(q)}”.</div>`; return; }
  list.innerHTML = shown.map((c) => `
    <div class="cap${c.captcha ? " captcha" : ""}" data-id="${esc(c.id)}">
      <div class="q">${esc(c.query)}${c.captcha ? `<span class="cpill">CAPTCHA</span>` : ""}</div>
      <div class="m">${c.browser === "chrome" ? "Chrome" : "Brave"} · ${c.device === "mobile" ? "Mobile" : "Desktop"} · ${c.headless ? "Headless · " : ""}${c.mode === "incognito" ? "Incognito" : "Logged-in"}${c.profileName ? " (" + esc(c.profileName) + ")" : ""} · ${c.tag ? esc(c.tag) + " · " : ""}${new Date(c.capturedAt).toLocaleString()} · ${kb(c.bytes)}${c.captcha ? " · CAPTCHA" : ""}</div>
      <a class="vs" href="/view-page/${encodeURIComponent(c.id)}" target="_blank">View page ↗</a> · <a class="vs" href="/view-source/${encodeURIComponent(c.id)}" target="_blank">View source ↗</a>
    </div>`).join("");
  list.querySelectorAll("a.vs").forEach((a) => (a.onclick = (e) => e.stopPropagation()));
  list.querySelectorAll(".cap").forEach((el) => (el.onclick = () => select(el.dataset.id)));
  if (current) list.querySelector(`.cap[data-id="${CSS.escape(current.id)}"]`)?.classList.add("sel");
}

$("#lq").oninput = renderList;

// New captures (e.g. from Run again) show up in the list without a page refresh
const sig = (list) => list.map((c) => c.id + "@" + c.capturedAt).join("|");
setInterval(async () => {
  try {
    const fresh = await (await fetch("/api/captures")).json();
    if (sig(fresh) === sig(captures)) return;
    const before = current && captures.find((c) => c.id === current.id);
    captures = fresh;
    adsCache.clear(); // keyword totals changed
    renderList();
    // The open entry was overwritten (Run again / retry): reload it in place
    const after = current && captures.find((c) => c.id === current.id);
    if (after && before && after.capturedAt !== before.capturedAt) select(after.id);
  } catch {}
}, 5000);
$("#lq").onkeydown = (e) => {
  if (e.key === "Escape") { e.target.value = ""; renderList(); }
  if (e.key === "Enter") { const first = $("#caps .cap"); if (first) select(first.dataset.id); }
};

async function select(id) {
  current = captures.find((c) => c.id === id);
  history.replaceState(null, "", "/source?id=" + encodeURIComponent(id));
  document.querySelectorAll(".cap").forEach((el) => el.classList.toggle("sel", el.dataset.id === id));
  raw = await (await fetch(`/api/captures/${encodeURIComponent(id)}/raw`)).text();
  // Real HTML parse (DOMParser never runs the page's scripts)
  doc = new DOMParser().parseFromString(raw, "text/html");
  renderView();
}

function renderView() {
  const c = current;
  $("#view").innerHTML = `
    <div id="head">
      <h2>${esc(c.query)} ${c.tag ? `<span class="muted" style="font-weight:400">· ${esc(c.tag)}</span>` : ""}</h2>
      <div class="tags">
        <span class="bb">${c.browser === "brave" ? "Brave" : "Chrome"}</span>
        <span class="bb">${c.device === "mobile" ? "Mobile" : "Desktop"}</span>
        <span class="bb">${c.headless ? "Headless" : "Headed"}</span>
        <span class="mb ${c.mode === "incognito" ? "incognito" : "logged-in"}">${c.mode === "incognito" ? "Incognito" : "Logged-in"}${c.profileName ? " · " + esc(c.profileName) : ""}</span>
      </div>
      <div class="m">${new Date(c.capturedAt).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })} · ${new Date(c.capturedAt).toLocaleTimeString()} · ${kb(c.bytes)}</div>
    </div>
    ${c.captcha ? `
    <div id="again">
      <div class="atext"><b>Stuck on a CAPTCHA</b><span>Google blocked this search. Try it again, optionally with other settings.</span></div>
      <div class="opts">
        <select id="agBrowser" aria-label="Browser"><option value="chrome">Chrome</option><option value="brave">Brave</option></select>
        <select id="agDevice" aria-label="Device"><option value="mobile">Mobile</option><option value="desktop">Desktop</option></select>
        <select id="agWindow" aria-label="Window"><option value="headless">Headless</option><option value="headed">Headed</option></select>
        <select id="agMode" aria-label="Mode"><option value="incognito">Incognito</option><option value="logged-in">Logged-in</option></select>
        <button id="agRun" class="primary">Run again</button>
      </div>
      <div class="msg" id="agMsg"></div>
    </div>` : ""}
    <div id="toolbar" class="row">
      <button data-mode="ads">Ads data</button>
      <button data-mode="parsed">Parsed page</button>
      <button data-mode="preview">Preview</button>
      <button data-mode="results">Results</button>
      <span style="flex:1"></span>
      <a href="/view-page/${encodeURIComponent(c.id)}" target="_blank" style="font-weight:600">View page ↗</a>
      <a href="/view-source/${encodeURIComponent(c.id)}" target="_blank" style="font-weight:600">View source ↗</a>
      <button id="copy">Copy</button>
      <button id="dl">Download</button>
      <button id="del" title="Delete this capture">Delete</button>
    </div>
    <div id="body"></div>`;
  $("#toolbar").querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => { mode = b.dataset.mode; renderBody(); }));
  if (c.captcha) {
  $("#agBrowser").value = c.browser === "brave" ? "brave" : "chrome";
  $("#agDevice").value = c.device === "desktop" ? "desktop" : "mobile";
  $("#agWindow").value = c.headless ? "headless" : "headed";
  $("#agMode").value = c.mode === "logged-in" ? "logged-in" : "incognito";
  $("#agRun").onclick = async () => {
    $("#agRun").disabled = true;
    try {
      const r = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
        queries: (c.tag ? c.tag + "  " : "") + c.query,
        browser: $("#agBrowser").value, device: $("#agDevice").value,
        headless: $("#agWindow").value === "headless", mode: $("#agMode").value, freshBrowser: true,
        replaceId: c.id, // update this entry instead of adding a new one
      }) });
      const d = await r.json();
      $("#agMsg").innerHTML = d.error ? esc(d.error) : `Queued. Follow it on <a href="/">Run queries</a>. This entry updates by itself when the run finishes.`;
    } catch { $("#agMsg").textContent = "Could not reach the server."; }
    $("#agRun").disabled = false;
  };
  }
  $("#copy").onclick = async () => { await navigator.clipboard.writeText(raw); flash($("#copy"), "Copied"); };
  $("#dl").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([raw], { type: "text/html" }));
    a.download = `${c.id}.html`; a.click(); URL.revokeObjectURL(a.href);
  };
  $("#del").onclick = async () => {
    if (!confirm(`Delete capture "${c.query}"?`)) return;
    await fetch(`/api/captures/${encodeURIComponent(c.id)}`, { method: "DELETE" });
    current = null; history.replaceState(null, "", "/source"); loadList();
  };
  renderBody();
}

function flash(btn, text) { const o = btn.textContent; btn.textContent = text; setTimeout(() => (btn.textContent = o), 1200); }

function renderBody() {
  document.querySelectorAll("[data-mode]").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
  const body = $("#body");
  if (mode === "preview") {
    body.innerHTML = current.device === "mobile"
      ? `<div style="flex:1;display:flex;justify-content:center;background:var(--bg);overflow:auto;padding:16px 0"><iframe sandbox="allow-popups allow-popups-to-escape-sandbox" style="flex:none;width:412px;height:100%;min-height:600px;border:1px solid var(--border);border-radius:18px" src="/view-page/${encodeURIComponent(current.id)}?bar=0&frame=1"></iframe></div>`
      : `<iframe sandbox="allow-popups allow-popups-to-escape-sandbox" style="height:100%" src="/view-page/${encodeURIComponent(current.id)}?bar=0"></iframe>`;
    body.style.display = "flex"; return;
  }
  body.style.display = "";
  if (mode === "ads") return renderAds(body);
  if (mode === "parsed") return renderParsed(body);
  if (mode === "results") {
    // Parsed from the saved source (captures no longer store results)
    const r = parsePage(doc).organic.map((x) => ({ title: x.title, url: x.href, site: x.site }));
    body.innerHTML = `<div id="results">${current.captcha ? `<p style="color:var(--warn)">Google showed a CAPTCHA for this query.</p>` : ""}
      <table><thead><tr><th>#</th><th>Title</th><th>Site</th></tr></thead><tbody>
      ${r.map((x, i) => `<tr><td class="muted">${i + 1}</td><td><a href="${esc(x.url)}" target="_blank" rel="noreferrer">${esc(x.title)}</a></td><td class="muted">${esc(x.site || "")}</td></tr>`).join("") || `<tr><td colspan="3" class="muted">No results.</td></tr>`}
      </tbody></table></div>`;
    return;
  }
  mode = "ads"; // unknown tab: show Ads data
  return renderBody();
}

// ================= Ads data (from SQLite, extracted from the saved source) =================
async function renderAds(body) {
  const id = current.id;
  if (!adsCache.has(id)) {
    body.innerHTML = `<div class="empty">Loading ads data…</div>`;
    const r = await fetch(`/api/captures/${encodeURIComponent(id)}/ads`);
    adsCache.set(id, r.ok ? await r.json() : { error: (await r.json().catch(() => ({}))).error || "No ads data. If the code was just updated, restart the web server." });
    if (current?.id !== id || mode !== "ads") return; // user moved on while loading
  }
  const d = adsCache.get(id);
  if (d.error) { body.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  const m = d.metrics, n = (v) => Number(v || 0), total = n(m.total_runs);
  const pct = (a, b) => (b ? Math.round((100 * a) / b) + "%" : "—");
  const plural = (k, w) => `${k} ${w}${k === 1 ? "" : "s"}`;
  const kw = d.run.mcat_id ? `MCAT ${esc(d.run.mcat_id)} · ${esc(d.run.mcat_name)}` : esc(d.run.mcat_name);
  const none = (t) => `<p class="muted" style="margin:0">${t}</p>`;
  const nameCell = (name, domain, im) => `${esc(name)}${name !== domain ? ` <span class="muted">· ${esc(domain)}</span>` : ""}${im ? ` <span class="pill im">IndiaMART</span>` : ""}`;
  const when = (r) => `${esc(r.run_date)} ${esc(r.run_time)} · ${esc(r.city || "—")} · ${esc(r.device)}`;
  const okRuns = d.runs.filter((r) => r.status === "ok");

  // One dedicated section per requirement field, named exactly as in the requirement
  const section = (name, definition, value, sub, inner) => `
    <section class="fsec">
      <div class="fhead"><div><h3>${name}</h3><p>${definition}</p></div><div class="fval"><b>${value}</b>${sub ? `<span>${sub}</span>` : ""}</div></div>
      <div class="fbody">${inner}</div>
    </section>`;

  const adsTable = (list, withPrice) => list.length ? `
    <table><thead><tr><th>Run</th><th class="num">#</th><th>Advertiser</th><th>Title</th>${withPrice ? `<th class="num">Price</th>` : ""}<th>Brand</th></tr></thead><tbody>
    ${list.map((a) => `<tr class="${a.run_id === id ? "cur" : ""}"><td class="muted" style="white-space:nowrap">${when(a)}</td><td class="num">${a.position}</td>
      <td>${nameCell(a.advertiser_name, a.advertiser_domain, a.is_indiamart)}</td>
      <td>${a.landing_url ? `<a href="${esc(a.landing_url)}" target="_blank" rel="noreferrer">${esc(a.title)}</a>` : esc(a.title)}</td>
      ${withPrice ? `<td class="num">${a.price != null ? "₹" + Number(a.price).toLocaleString("en-IN") : ""}</td>` : ""}
      <td>${a.brand ? esc(a.brand) : `<span class="pill">${esc(a.brand_status.replace(/_/g, " "))}</span>`}</td></tr>`).join("")}
    </tbody></table>` : "";

  const shoppingAds = d.keywordAds.filter((a) => a.ad_type === "shopping");
  const searchAds = d.keywordAds.filter((a) => a.ad_type === "search");
  const bothRuns = okRuns.filter((r) => r.shopping_ads_seen > 0 && r.search_ads_seen > 0);

  const cov = Object.fromEntries(d.brandCoverage.map((c) => [c.status, c.ads]));
  const totalAds = d.brandCoverage.reduce((a, c) => a + c.ads, 0);
  const covLine = totalAds
    ? `Brand identified in ${pct(n(cov.found), totalAds)} of ${plural(totalAds, "ad")} (not in ad ${pct(n(cov.not_in_ad), totalAds)}, unbranded ${pct(n(cov.unbranded), totalAds)}, unresolved ${pct(n(cov.unresolved), totalAds)}).`
    : "No ads seen for this keyword yet.";

  body.innerHTML = `<div id="ads">
    <div class="kw">Keyword: <b>${kw}</b> · Total Runs: <b>${total}</b> · City Count: <b>${n(m.city_count)}</b>${d.cities.length ? ` (${d.cities.map((c) => esc(c.city)).join(", ")})` : ""}${d.skippedRuns ? ` · ${plural(d.skippedRuns, "CAPTCHA/error run")} not counted` : ""}</div>

    ${section("Shopping Ads Count", "Frequency of Google Shopping ads appearing.", n(m.shopping_runs), `of ${plural(total, "run")} · ${pct(n(m.shopping_runs), total)} · ${plural(shoppingAds.length, "ad")} seen`,
      shoppingAds.length ? adsTable(shoppingAds, true) : none("No Shopping ads appeared in any run."))}

    ${section("Search Ads Count", "Frequency of Google Search ads appearing.", n(m.search_runs), `of ${plural(total, "run")} · ${pct(n(m.search_runs), total)} · ${plural(searchAds.length, "ad")} seen`,
      searchAds.length ? adsTable(searchAds, false) : none("No Search ads appeared in any run."))}

    ${section("Search + Shopping Count", "Frequency of both Shopping and Search ads appearing together.", n(m.both_runs), `of ${plural(total, "run")} · ${pct(n(m.both_runs), total)}`,
      bothRuns.length ? `<table><thead><tr><th>Run</th><th class="num">Shopping ads</th><th class="num">Search ads</th></tr></thead><tbody>
        ${bothRuns.map((r) => `<tr class="${r.run_id === id ? "cur" : ""}"><td>${when(r)}</td><td class="num">${r.shopping_ads_seen}</td><td class="num">${r.search_ads_seen}</td></tr>`).join("")}</tbody></table>`
        : none("No run had both Shopping and Search ads on the same page."))}

    ${section("Top 5 Brands", "The top 5 brands that appeared, along with their frequencies.", d.topBrands.length, d.topBrands.length && d.topBrands.length < 5 ? `Only ${plural(d.topBrands.length, "brand")} found` : "brands",
      `<p class="note">${covLine}</p>${d.topBrands.length ? `<table><thead><tr><th>#</th><th>Brand</th><th class="num">Frequency (ads)</th><th class="num">Runs seen</th></tr></thead><tbody>
        ${d.topBrands.map((b, i) => `<tr><td class="muted">${i + 1}</td><td>${esc(b.brand)}</td><td class="num">${b.ads}</td><td class="num">${b.runs}</td></tr>`).join("")}</tbody></table>` : none("No brand identified yet.")}`)}

    ${section("Top 5 Advertisers", "The top 5 advertisers that appeared, along with their frequencies.", d.topAdvertisers.length, "advertisers",
      d.topAdvertisers.length ? `<table><thead><tr><th>#</th><th>Advertiser</th><th class="num">Frequency (runs)</th><th class="num">Ad slots</th><th class="num">Shopping</th><th class="num">Search</th></tr></thead><tbody>
        ${d.topAdvertisers.map((r, i) => `<tr><td class="muted">${i + 1}</td><td>${nameCell(r.name, r.domain, r.is_indiamart)}</td><td class="num">${r.runs} <span class="muted">(${pct(r.runs, total)})</span></td><td class="num">${r.ads}</td><td class="num">${r.shopping_ads}</td><td class="num">${r.search_ads}</td></tr>`).join("")}
        </tbody></table>` : none("No advertisers seen."))}

    ${card("All runs of this keyword", d.runs.length, `
      <table><thead><tr><th>Date</th><th>Time</th><th>City</th><th>Device</th><th>Status</th><th class="num">Shopping ads</th><th class="num">Search ads</th></tr></thead><tbody>
      ${d.runs.map((r) => `<tr class="${r.run_id === id ? "cur" : ""}"><td>${esc(r.run_date)}</td><td>${esc(r.run_time)}</td><td>${esc(r.city || "—")}</td><td>${esc(r.device)}</td><td>${esc(r.status)}</td><td class="num">${r.shopping_ads_seen}</td><td class="num">${r.search_ads_seen}</td></tr>`).join("")}
      </tbody></table>`, false)}
  </div>`;
}

// ================= Parsed page =================
const txt = (el) => (el?.textContent || "").replace(/\s+/g, " ").trim();
const abs = (h) => !h ? "" : h.startsWith("/") ? "https://www.google.com" + h : h;
const uniq = (arr) => [...new Set(arr.filter(Boolean))];

function resultBlock(a, minExtra) {
  let b = a;
  const title = txt(a.querySelector("h3, [role=heading]"));
  while (b.parentElement && !["rso", "search", "tads", "bottomads"].includes(b.parentElement.id) && txt(b).length < title.length + minExtra) b = b.parentElement;
  return b;
}

function parsePage(d) {
  const seen = new Set();
  // Desktop: <h3> title links in #search. Mobile: role="heading" title links inside a [data-snc] block in #rso.
  const desktopLinks = [...d.querySelectorAll("#search a:has(h3)")];
  const resultLinks = desktopLinks.length ? desktopLinks : [...d.querySelectorAll("#rso a[href]:has([role=heading])")].filter((a) => a.closest("[data-snc]"));
  const organic = resultLinks.filter((a) => !a.closest("#tads, #bottomads") && !seen.has(a.getAttribute("href")) && seen.add(a.getAttribute("href"))).map((a) => {
    const b = a.closest("[jscontroller='SC7lYd'], [data-rpos], .MjjYud, [data-snc]") || resultBlock(a, 80);
    const head = a.querySelector("h3") || a.querySelector("[role=heading]");
    return {
      title: txt(head),
      href: abs(a.getAttribute("href")),
      site: (txt(a.querySelector("cite")) || txt(b.querySelector("cite")) || txt(a).replace(txt(head), "").trim()).replace(/(\S)(https?:\/\/)/, "$1 · $2").slice(0, 90),
      snippet: txt(b.querySelector(".VwiC3b")) || txt(b.querySelector("[data-sncf='1']")) || "",
    };
  });
  const ads = [...d.querySelectorAll("#tads a, #bottomads a")].filter((a) => a.querySelector("[role=heading]")).map((a) => {
    const b = resultBlock(a, 60);
    let host = "";
    try { host = new URL(a.getAttribute("data-pcu") || "").hostname; } catch {}
    return {
      where: a.closest("#tads") ? "Top" : "Bottom",
      title: txt(a.querySelector("[role=heading]")),
      site: host || txt(b.querySelector("cite")),
      href: abs(a.getAttribute("data-pcu") || a.getAttribute("href")),
      snippet: txt(b).replace(txt(a), "").slice(0, 300),
    };
  });
  const paa = uniq([...d.querySelectorAll("[data-q]")].map((e) => e.getAttribute("data-q")));
  const related = uniq([...d.querySelectorAll("#botstuff a[href*='/search?']")].map(txt).filter((t) => t.length < 100));
  const headings = [...d.querySelectorAll("h1, h2, h3")].map((h) => ({ tag: h.tagName.toLowerCase(), text: txt(h) })).filter((h) => h.text);
  const links = [...d.querySelectorAll("a[href]")].map((a) => ({ text: txt(a).slice(0, 120), href: abs(a.getAttribute("href")) }));
  const scripts = [...d.querySelectorAll("script")];
  const styles = [...d.querySelectorAll("style")];
  return {
    organic, ads, paa, related, headings, links,
    overview: {
      "Title": txt(d.querySelector("title")),
      "Language": d.documentElement.getAttribute("lang") || "—",
      "Meta description": d.querySelector("meta[name=description]")?.getAttribute("content") || "—",
      "Total elements": d.getElementsByTagName("*").length.toLocaleString(),
      "Links": links.length.toLocaleString(),
      "Images": d.querySelectorAll("img").length.toLocaleString(),
      "Scripts": `${scripts.length} (${kb(scripts.reduce((n, s) => n + s.textContent.length, 0))} inline)`,
      "Styles": `${styles.length} (${kb(styles.reduce((n, s) => n + s.textContent.length, 0))})`,
      "Iframes": d.querySelectorAll("iframe").length,
      "Forms / inputs": `${d.querySelectorAll("form").length} / ${d.querySelectorAll("input, textarea").length}`,
    },
  };
}

function card(title, count, inner, open = true) {
  return `<details class="card" ${open ? "open" : ""}><summary>${esc(title)} <span class="muted">(${count})</span></summary><div class="cb">${inner}</div></details>`;
}

function renderParsed(body) {
  const p = parsePage(doc);
  const link = (h, t) => `<a href="${esc(h)}" target="_blank" rel="noreferrer">${esc(t || h)}</a>`;
  const none = `<p class="muted">None found on this page.</p>`;
  body.innerHTML = `<div id="parsed">
    ${card("Overview", Object.keys(p.overview).length, `<table class="kv">${Object.entries(p.overview).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</table>`)}
    ${card("Organic results", p.organic.length, p.organic.length ? p.organic.map((r, i) => `
      <div class="res"><div class="rn">${i + 1}</div><div>
        <div class="rs">${esc(r.site)}</div>
        <div class="rt">${link(r.href, r.title)}</div>
        ${r.snippet ? `<div class="rp">${esc(r.snippet)}</div>` : ""}
      </div></div>`).join("") : none)}
    ${card("Sponsored (ads)", p.ads.length, p.ads.length ? p.ads.map((r, i) => `
      <div class="res"><div class="rn">${r.where}</div><div>
        <div class="rs">${esc(r.site)}</div>
        <div class="rt">${link(r.href, r.title)}</div>
        ${r.snippet ? `<div class="rp">${esc(r.snippet)}</div>` : ""}
      </div></div>`).join("") : none)}
    ${card("People also ask", p.paa.length, p.paa.length ? `<ul>${p.paa.map((q) => `<li>${esc(q)}</li>`).join("")}</ul>` : none)}
    ${card("Related searches", p.related.length, p.related.length ? `<div class="chips">${p.related.map((q) => `<span>${esc(q)}</span>`).join("")}</div>` : none)}
    ${card("Headings", p.headings.length, p.headings.length ? `<ul>${p.headings.map((h) => `<li><code class="muted">${h.tag}</code> ${esc(h.text)}</li>`).join("")}</ul>` : none, false)}
    ${card("All links", p.links.length, `<table class="kv">${p.links.map((l) => `<tr><td>${esc(l.text || "—")}</td><td class="u">${link(l.href)}</td></tr>`).join("")}</table>`, false)}
  </div>`;
}

loadList();
