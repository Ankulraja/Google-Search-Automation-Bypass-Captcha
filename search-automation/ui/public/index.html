<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Automation – Run Queries</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
<style>
  .grid { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  textarea { min-height: 220px; resize: vertical; }
  .mb { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .mb.logged-in { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .mb.incognito { background: color-mix(in srgb, var(--tag) 20%, transparent); color: var(--tag); }
  h2 { font-size: 14px; margin: 0 0 10px; }
  /* ---- Controls: symmetric 2-column grid ---- */
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; margin: 6px 0 16px; }
  .controls .full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field[hidden] { display: none; }
  .field > .cap { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .ctl { height: 38px; border: 1px solid var(--border); border-radius: 8px; background: var(--code-bg); }
  /* Browser: segmented, two equal halves */
  .seg { display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label { display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; transition: background .15s, color .15s; }
  .seg label:last-of-type { border-left: 1px solid var(--border); }
  .seg input:checked + label { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .seg input:disabled + label { opacity: .4; cursor: not-allowed; }
  .seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* Mode: toggle box, same height as the browser control */
  .modebox { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 12px; cursor: pointer; user-select: none; }
  .modebox input { position: absolute; opacity: 0; pointer-events: none; }
  .modebox .state { order: -1; font-size: 13px; font-weight: 600; color: var(--ok); }
  .modebox input:checked ~ .state { color: var(--tag); }
  .switch { position: relative; flex: 0 0 40px; width: 40px; height: 22px; border-radius: 11px; background: var(--ok); transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
  .modebox input:checked ~ .switch { background: var(--tag); }
  .modebox input:checked ~ .switch::after { transform: translateX(18px); }
  .modebox input:focus-visible ~ .switch { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Profile select: full width */
  select.ctl { width: 100%; color: var(--text); padding: 0 10px; font: inherit; font-size: 13px; }
  /* Run button: full width */
  #run { width: 100%; height: 42px; font-size: 14px; }
  #msg { display: block; text-align: center; margin-top: 10px; }
  #msg:empty { display: none; }
  .bb { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; border: 1px solid var(--border); color: var(--muted); margin-right: 4px; }
  .hint { font-size: 12px; margin: 8px 0 12px; }
  #msg { font-size: 13px; }
</style>
</head>
<body>
<header class="top">
  <h1>Search Automation · Google search runner</h1>
  <nav><a href="/" class="active">1. Run queries</a><a href="/source">2. Page source</a></nav>
  <button class="theme-btn" id="themeBtn" type="button">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="tl">Dark</span>
  </button>
</header>
<main class="grid">
  <section class="panel">
    <div id="health" class="muted" style="font-size:12px;margin-bottom:10px">Checking path server…</div>
    <h2>Search queries</h2>
    <textarea id="q" placeholder="One query per line, e.g.&#10;9898    Massage Chair&#10;191481  Interactive Flat Panel&#10;Polyester Fabric"></textarea>
    <p class="hint muted">One query per line. A leading number (e.g. an MCAT id) is kept as a tag and not searched.</p>
    <div class="controls">
      <div class="field">
        <span class="cap">Browser</span>
        <div class="seg ctl" role="radiogroup" aria-label="Browser">
          <input type="radio" name="browser" id="br-chrome" value="chrome" checked><label for="br-chrome" title="Google Chrome">Chrome</label>
          <input type="radio" name="browser" id="br-brave" value="brave"><label for="br-brave">Brave</label>
        </div>
      </div>
      <div class="field">
        <span class="cap">Device</span>
        <div class="seg ctl" role="radiogroup" aria-label="Device">
          <input type="radio" name="device" id="dv-desktop" value="desktop" checked><label for="dv-desktop">Desktop</label>
          <input type="radio" name="device" id="dv-mobile" value="mobile"><label for="dv-mobile">Mobile</label>
        </div>
      </div>
      <div class="field full">
        <span class="cap">Mode</span>
        <label class="modebox ctl" id="modeBox">
          <input type="checkbox" id="modeToggle" aria-label="Incognito mode" checked>
          <span class="switch"></span>
          <span class="state" id="modeState">Incognito</span>
        </label>
      </div>
      <div class="field full" id="profileField" hidden>
        <span class="cap">Profile</span>
        <select id="profile" class="ctl"></select>
      </div>
    </div>
    <button class="primary" id="run">Run search</button>
    <span id="msg" class="muted"></span>
  </section>

  <section class="panel">
    <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
      <h2 style="margin:0">Runs <span id="state" class="muted" style="font-weight:400"></span></h2>
      <button id="clear">Clear finished</button>
    </div>
    <table>
      <thead><tr><th>#</th><th>Browser / Device / Mode</th><th>Tag</th><th>Query</th><th>Status</th><th>Results</th><th></th></tr></thead>
      <tbody id="jobs"><tr><td colspan="7" class="muted">No runs yet.</td></tr></tbody>
    </table>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

$("#run").onclick = async () => {
  const queries = $("#q").value;
  if (!queries.trim()) { $("#msg").textContent = "Enter at least one query."; return; }
  $("#run").disabled = true;
  try {
    const r = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ queries, mode: currentMode(), browser: currentBrowser(), device: currentDevice(), profile: currentMode() === "logged-in" ? $("#profile").value : undefined }) });
    const d = await r.json();
    $("#msg").textContent = d.error || `Queued ${d.added} quer${d.added === 1 ? "y" : "ies"}.`;
    if (!d.error) $("#q").value = "";
  } catch (e) { $("#msg").textContent = "Could not reach the UI server."; }
  $("#run").disabled = false;
  refresh();
};
$("#clear").onclick = async () => { await fetch("/api/jobs/clear", { method: "POST" }); refresh(); };

async function refresh() {
  try {
    const { working, jobs } = await (await fetch("/api/jobs")).json();
    $("#state").textContent = working ? "· Brave is running…" : "";
    $("#jobs").innerHTML = jobs.length ? jobs.slice().reverse().map((j) => `
      <tr>
        <td class="muted">${j.id}</td>
        <td><span class="bb">${j.browser === "brave" ? "Brave" : "Chrome"}</span><span class="bb">${j.device === "mobile" ? "Mobile" : "Desktop"}</span><span class="mb ${j.mode}">${j.mode === "incognito" ? "Incognito" : "Logged-in"}</span>${j.profileName ? `<div class="muted" style="font-size:11px;margin-top:2px">${esc(j.profileName)}</div>` : ""}</td>
        <td>${esc(j.tag || "—")}</td>
        <td>${esc(j.query)}</td>
        <td><span class="badge s-${j.status}">${j.status}</span>${j.error ? `<div class="muted" style="font-size:12px">${esc(j.error)}</div>` : ""}${j.note ? `<div class="s-captcha" style="font-size:12px">${esc(j.note)}</div>` : ""}</td>
        <td>${j.resultCount ?? "—"}</td>
        <td style="white-space:nowrap">${j.captureId ? `<a href="/view-page/${encodeURIComponent(j.captureId)}" target="_blank">View page ↗</a> · <a href="/view-source/${encodeURIComponent(j.captureId)}" target="_blank">View source ↗</a> · <a href="/source?id=${encodeURIComponent(j.captureId)}">Parsed</a>` : ""}</td>
      </tr>`).join("") : `<tr><td colspan="7" class="muted">No runs yet.</td></tr>`;
  } catch {}
}
async function health() {
  try {
    const { pathServer } = await (await fetch("/api/health")).json();
    $("#health").innerHTML = pathServer
      ? `<span class="s-done">●</span> Path server running, ready to search`
      : `<span class="s-error">●</span> Path server (port 3000) is not running. Start it with <code>../.venv/bin/python server/server.py</code>`;
  } catch { $("#health").innerHTML = `<span class="s-error">●</span> UI server not reachable`; }
}
const HINTS = {
  "logged-in": "Uses a copy of your Brave profile: Google sign-in, cookies and extensions. Fewer CAPTCHAs.",
  "incognito": "Private window on a fresh, empty profile: no logins, no history, nothing saved. Each query starts clean.",
};
const currentMode = () => ($("#modeToggle").checked ? "incognito" : "logged-in");
const showMode = () => {
  const m = currentMode();
  $("#modeState").textContent = m === "incognito" ? "Incognito" : "Logged-In";
  $("#modeBox").title = HINTS[m];
};
$("#modeToggle").checked = true; // Incognito by default
$("#modeToggle").onchange = () => { showMode(); updateProfiles(); };

// ----- Browser selector + profile list -----
let browsers = [];
const currentDevice = () => document.querySelector('input[name="device"]:checked').value;
const currentBrowser = () => document.querySelector('input[name="browser"]:checked').value;
function updateProfiles() {
  const b = browsers.find((x) => x.id === currentBrowser());
  const show = currentMode() === "logged-in" && b;
  $("#profileField").hidden = !show;
  if (!show) return;
  const prev = $("#profile").dataset.browser === b.id ? $("#profile").value : null;
  $("#profile").innerHTML = b.profiles.map((p) =>
    `<option value="${esc(p.dir)}">${esc(p.name)}${p.email ? " — " + esc(p.email) : ""}${p.dir === b.lastUsed ? " (last used)" : ""}</option>`).join("");
  $("#profile").value = prev || b.lastUsed || (b.profiles[0] && b.profiles[0].dir) || "";
  $("#profile").dataset.browser = b.id;
  $("#profile").title = b.error || "";
}
document.querySelectorAll('input[name="browser"]').forEach((r) => (r.onchange = updateProfiles));
fetch("/api/browsers").then((r) => r.json()).then((list) => {
  browsers = list;
  for (const b of list) {
    const radio = $("#br-" + b.id);
    if (!radio) continue;
    radio.disabled = !b.installed;
    radio.nextElementSibling.title = b.installed ? "" : b.label + " is not installed";
  }
  const sel = document.querySelector('input[name="browser"]:checked');
  if (sel.disabled) { const ok = document.querySelector('input[name="browser"]:not(:disabled)'); if (ok) ok.checked = true; }
  updateProfiles();
}).catch(() => {});
showMode();
refresh();
health();
setInterval(refresh, 1500);
setInterval(health, 5000);
</script>
</body>
</html>
